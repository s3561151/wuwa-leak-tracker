<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151b31"><link rel="manifest" href="/manifest.webmanifest"><title>鳴潮情報追蹤站</title><style>body{margin:0;background:#0d1222;color:#f1f3fa;font:16px system-ui,sans-serif}main{max-width:760px;margin:auto;padding:20px}header{display:flex;align-items:center;gap:12px}h1{font-size:25px;margin-bottom:3px}.muted{color:#a9b5cf;font-size:13px}.panel{background:#19233a;border:1px solid #33415d;border-radius:16px;padding:16px;margin:15px 0}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}button,input,select{border:1px solid #4a5b7d;border-radius:9px;padding:10px;background:#202e49;color:white;font-size:15px}button{cursor:pointer}button.active{background:#4868a2}a{color:#a9d7ff}.tag{font-size:12px;background:#3a3455;border-radius:20px;padding:5px 9px}.card{border-top:1px solid #33415d;padding:14px 0}.card h3{margin:6px 0}.small{font-size:13px}#status{margin-top:9px}input{max-width:100%}</style></head><body><main><header><div style="font-size:40px">🌊</div><div><h1>鳴潮情報追蹤站</h1><div class="muted">Wuthering Waves · 非官方傳聞整理</div></div></header><section class="panel"><b>每日情報檢查</b><p class="muted">預定每天 08:00（台灣時間）執行。資料取自公開社群，所有未經官方證實的資訊均視為傳聞。</p><div class="row"><button id="refresh">重新載入情報</button><a href="https://www.reddit.com/r/WutheringWavesLeaks/" target="_blank" rel="noopener">查看原始社群 ↗</a></div><div id="status" class="muted">正在讀取資料…</div></section><section class="panel"><b>情報篩選</b><div class="row" style="margin-top:12px"><select id="category"><option value="">全部分類</option><option>角色</option><option>卡池</option><option>武器</option><option>聲骸</option><option>地圖</option><option>活動</option><option>其他</option></select><input id="search" placeholder="搜尋標題、版本或關鍵字"></div></section><section class="panel"><b>情報清單</b><div id="items" class="muted" style="margin-top:12px">尚無情報</div></section><p class="muted">本站不代表庫洛遊戲。自動分類僅供快速瀏覽，並不代表情報真實性。翻譯未設定時顯示原文標題。</p></main><script>let data=[];const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const q=$('search').value.toLowerCase(),cat=$('category').value;const list=data.filter(x=>(!cat||x.category===cat)&&JSON.stringify(x).toLowerCase().includes(q));$('items').innerHTML=list.length?list.map(x=>`<article class="card"><div class="row"><span class="tag">${esc(x.category||'其他')}</span><span class="tag">未證實</span><span class="muted">${esc(x.version||'版本未定')}</span></div><h3>${esc(x.title_zh||x.title)}</h3><div class="muted small">${esc(x.published||'日期未知')} · ${esc(x.source||'公開來源')}</div><p class="small">${esc(x.summary_zh||'尚未設定自動翻譯，請閱讀原始來源。')}</p><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">查看原始貼文 ↗</a></article>`).join(''):'目前沒有符合條件的情報。';}async function load(){ $('status').textContent='正在載入…';try{let r=await fetch('/.netlify/functions/feed',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let j=await r.json();data=j.items||[];$('status').textContent=`資料最後更新：${j.updated_at?new Date(j.updated_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}):'尚未同步'}｜共 ${data.length} 筆`;}catch(e){data=[];$('status').textContent='尚未取得後端資料。請確認 Netlify Functions 已部署及完成首次同步。';}render();} $('refresh').onclick=load;$('search').oninput=render;$('category').onchange=render;if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});load();</script></body></html>
