<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151b31"><link rel="manifest" href="/manifest.webmanifest"><title>鳴潮情報追蹤站 v1.2</title><style>body{margin:0;background:#0d1222;color:#f1f3fa;font:16px system-ui,sans-serif}main{max-width:800px;margin:auto;padding:20px}header{display:flex;align-items:center;gap:12px}h1{font-size:25px;margin-bottom:3px}.muted{color:#a9b5cf;font-size:13px}.panel{background:#19233a;border:1px solid #33415d;border-radius:16px;padding:16px;margin:15px 0}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}button,input,select{border:1px solid #4a5b7d;border-radius:9px;padding:10px;background:#202e49;color:white;font-size:15px}button{cursor:pointer}a{color:#a9d7ff}.tag{font-size:12px;background:#3a3455;border-radius:20px;padding:5px 9px}.card{border-top:1px solid #33415d;padding:14px 0}.card h3{margin:8px 0}.small{font-size:13px}#status{margin-top:9px}input{max-width:100%}.original{font-size:13px;color:#a9b5cf;margin-top:4px}</style></head><body><main><header><div style="font-size:40px">🌊</div><div><h1>鳴潮情報追蹤站 <span class="muted">v1.2</span></h1><div class="muted">Wuthering Waves · 非官方公開情報整理</div></div></header><section class="panel"><b>每日情報檢查</b><p class="muted">預定每天 08:00（台灣時間）執行。新聞 RSS 是二手來源，不代表爆料已證實，也不等同於直接追蹤爆料者。</p><div class="row"><button id="refresh">重新載入情報</button></div><div id="status" class="muted">正在讀取資料…</div></section><section class="panel"><b>情報篩選</b><div class="row" style="margin-top:12px"><select id="category"><option value="">全部分類</option><option>角色</option><option>卡池</option><option>武器</option><option>聲骸</option><option>地圖</option><option>活動</option><option>其他</option></select><input id="search" placeholder="搜尋標題、版本或關鍵字"></div></section><section class="panel"><b>情報清單</b><div id="items" class="muted" style="margin-top:12px">尚無情報</div></section><p class="muted">本站非庫洛官方網站。關鍵字篩選可能誤收或漏收文章；「未證實」不表示已查核。未設定 Google Cloud Translation API 時保留原文。</p></main><script>let data=[];const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function fmt(s){const d=new Date(s);return Number.isNaN(d.getTime())?'日期未知':d.toLocaleString('zh-TW',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false})}function render(){const q=$('search').value.toLowerCase(),cat=$('category').value;const list=data.filter(x=>(!cat||x.category===cat)&&[x.title,x.title_zh,x.version,x.source].join(' ').toLowerCase().includes(q));$('items').innerHTML=list.length?list.map(x=>`<article class="card"><div class="row"><span class="tag">${esc(x.category||'其他')}</span><span class="tag">未證實</span><span class="tag">二手來源</span><span class="muted">${esc(x.version?'版本 '+x.version:'版本未定')}</span></div><h3>${esc(x.title_zh||x.title)}</h3>${x.title_zh?`<div class="original">原文：${esc(x.title)}</div>`:''}<div class="muted small">${esc(fmt(x.published))}（台灣時間） · ${esc(x.source||'公開來源')}</div><p class="small">${esc(x.summary_zh||'尚無繁體中文摘要，請以原始來源內容為準。')}</p><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">閱讀原始報導 ↗</a></article>`).join(''):'目前沒有符合篩選條件的情報。';}async function load(){$('status').textContent='正在載入…';try{const r=await fetch('/.netlify/functions/feed',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();data=j.items||[];$('status').textContent=`資料最後更新：${j.updated_at?fmt(j.updated_at)+'（台灣時間）':'尚未同步'}｜共 ${data.length} 筆`;}catch(e){data=[];$('status').textContent='讀取後端資料失敗，請確認 Functions 與同步紀錄。'}render()}$('refresh').onclick=load;$('search').oninput=render;$('category').onchange=render;if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});load();</script></body></html>
